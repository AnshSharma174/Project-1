<html>
    <head>
        <title>Operator</title>
    </head>
    <body>
        <script>
            let age = 20;
            // == checks the value
            console.log("age == 20", age == 20); // true
            // === checks the value AND data type
            console.log("age === 20", age === 20);// true
            // != means "not equal"
            console.log("age != 18", age != 18);// true
            // !== means not equal value or type
            console.log("age > 18", age > 18);// true
            console.log("age < 18", age < 18);// false
            console.log("age >= 20", age >= 20);// true
            console.log("age <= 20", age <= 20);// true

            let marks = 80;
            console.log("marks >= 40 && marks <= 100", marks >= 40 && marks <= 100); // true
            console.log("marks >= 40 || marks <= 100", marks >= 40 || marks <= 100); // true

            console.log( 5 =="5"); //true
            console.log(5 ==="5"); //false

        </script>
    </body>
</html>
