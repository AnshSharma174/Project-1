<html>
    <head>
        <title>Object in javascript</title>
        
    </head>
    <body>
        <script>
            let student = {
                name: "Rahul",
                age: 20,
                course: "CSE"
            };
            console.log("Student Information: ", student);
            let fruits = ["Apple", "Banana", "Mango"];
            console.log("Fruits:", fruits);
            console.log("First Fruit:", fruits[0]);
            console.log("Second Fruits:", fruits[1]);
        </script>
    </body>
</html>
