// let

<html>
    <head>
        <title>Variable</title>
        <body>
            <script>
                //create a variable using let
                let age =20;
                //display the value
                console.log("Age:", age);
                //change the value
                age= 21;
                //display the new value
                console.log("New Age:", age);
                //const
                const pi = 3.14;
                console.log("pi:", pi);

            </script>
        </body>
    </head>
</html>
